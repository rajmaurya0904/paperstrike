# Weekly dependency updates, grouped so they arrive as a few PRs, not dozens.
# Security fixes are raised as soon as an advisory lands, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # the types follow the oldest Node we support (20), not the newest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /data
    schedule:
      interval: weekly
    ignore:
      # proto/MarketDataFeed_pb2.py was generated for protobuf 5, and growwapi needs <6
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]
    groups:
      data:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

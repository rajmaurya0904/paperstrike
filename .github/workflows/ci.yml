name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only token: CI only checks code, it never writes to the repo
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests
      - run: python -c "import server"
